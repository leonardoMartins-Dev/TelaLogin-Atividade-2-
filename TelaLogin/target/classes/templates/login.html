<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
<div class="login-container">
    <div class="login-image-logo-container">
        <canvas id="canvas3d"></canvas>
    </div>
    <div class="login-form">
        <form th:action="@{/login}" method="post" class="login-form">
            <img th:src="@{/images/teste.png}" alt="Logo" class="login-logo">
            <h4 class="login-title">Login</h4>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <input type="password" id="password" name="password" placeholder="Senha" required>
            <div class="login-button-container">
                <button type="submit">Entrar</button>
            </div>
            <p class="login-redirect-options">
                Ainda não tem cadastro? <br>
                <a href="/register">Cadastre-se</a> |
                <a href="/recoverpassword">Esqueceu sua senha?</a>
            </p>
        </form>
    </div>
</div>

<script type="module">
    import { Application } from 'https://unpkg.com/@splinetool/runtime@latest/build/runtime.js';

    const canvas = document.getElementById('canvas3d');
    const app = new Application(canvas);
    app.load('https://prod.spline.design/8Z61gEOQoC1du56j/scene.splinecode');

    // Repassa a posição do mouse pra dentro do canvas,
    // mesmo quando o cursor está fora dele (ex: em cima do formulário)
    window.addEventListener('mousemove', (e) => {
        const syntheticEvent = new PointerEvent('pointermove', {
            clientX: e.clientX,
            clientY: e.clientY,
            bubbles: true,
            cancelable: true,
            pointerId: 1,
            pointerType: 'mouse'
        });
        canvas.dispatchEvent(syntheticEvent);
    });
</script>
</body>

</html>
